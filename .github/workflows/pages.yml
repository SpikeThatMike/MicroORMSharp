name: Deploy Documentation

on:
  pull_request:
    branches:
      - main
    paths:
      - website/**
      - .github/workflows/pages.yml
  push:
    branches:
      - main
    paths:
      - website/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            Directory.Build.props

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Restore website
        run: dotnet restore website/MicroORMSharp.Website/MicroORMSharp.Website.csproj

      - name: Publish website
        run: dotnet publish website/MicroORMSharp.Website/MicroORMSharp.Website.csproj --configuration Release --no-restore --output artifacts/site

      - name: Prepare GitHub Pages artifact
        shell: pwsh
        run: |
          $publishPath = "artifacts/site/wwwroot"
          $indexPath = Join-Path $publishPath "index.html"
          $repoName = "${{ github.event.repository.name }}"
          $baseTag = "<base href=""/$repoName/"" />"

          $html = Get-Content -Path $indexPath -Raw
          if ($html -notmatch '<base href="/" />') {
            throw "Expected Blazor base href was not found in $indexPath."
          }

          $html = $html -replace '<base href="/" />', $baseTag
          Set-Content -Path $indexPath -Value $html -NoNewline
          Copy-Item -Path $indexPath -Destination (Join-Path $publishPath "404.html") -Force
          New-Item -ItemType File -Path (Join-Path $publishPath ".nojekyll") -Force | Out-Null

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/site/wwwroot

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
